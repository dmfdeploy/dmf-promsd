[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dmf-promsd"
dynamic = ["version"]
description = "DMF PromSD - NetBox-driven Prometheus http_sd adapter"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "prometheus-client>=0.21,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff==0.17.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {file = ["VERSION"]}

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E", "F", "I", "UP", "B", "SIM",
  # Blind excepts, blanket noqa comments, and unused noqa codes.
  "BLE001", "PGH004", "RUF100",
  # Complexity, branches, arguments, and statements, at ruff's default limits.
  "C901", "PLR0912", "PLR0913", "PLR0915",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
