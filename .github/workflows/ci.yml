name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - run: scripts/check.sh

  working-model:
    # Working-model block sync (umbrella issue dmfdeploy/dmfdeploy#32): the
    # agent-context block in CLAUDE.md/AGENTS.md/QWEN.md must stay byte-identical
    # to the umbrella template; --strict fails on a missing or drifted block.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      # Umbrella: canonical template + checker
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          repository: dmfdeploy/dmfdeploy
          ref: working-model-v2
          path: .umbrella
          persist-credentials: false
      - name: Working-model block sync (strict)
        run: .umbrella/bin/check-working-model-sync.sh --repo . --strict --template .umbrella/docs/templates/working-model-block.md
